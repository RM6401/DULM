<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #ff1493 0%, #800080 50%, #4b0082 100%);
      background-size: 200% 200%;
      animation: gradientBG 6s ease infinite alternate;
      transition: background 0.5s ease;
    }

    /* New class for the significant background change when "Yes" is pressed */
    body.yes-background {
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 50%, #ff0844 100%);
      background-size: 200% 200%;
      animation: gradientBG 4s ease infinite alternate;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3rem 2rem;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(219, 112, 147, 0.25);
      text-align: center;
      max-width: 380px;
      width: 88%;
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    .icon {
      font-size: 3rem;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #8a2be2;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .btn-container {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      color: white;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
    }

    .btn-yes:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(255, 105, 180, 0.6);
    }

    .btn-no {
      background: linear-gradient(135deg, #b19ffb 0%, #8a2be2 100%);
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .btn-no:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(138, 43, 226, 0.5);
    }

    .love-text {
      color: #ff1493;
      font-size: 2rem;
      font-weight: 700;
    }

    video {
      width: 100%;
      max-width: 280px;
      border-radius: 16px;
      display: block;
    }

    .btn-ok {
      background: linear-gradient(135deg, #b19ffb 0%, #8a2be2 100%);
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
      padding: 0.6rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      color: white;
      transition: all 0.25s ease;
    }

    .btn-ok:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(138, 43, 226, 0.5);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 24px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-box p {
      font-size: 1.3rem;
      font-weight: 600;
      color: #8a2be2;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Home Page -->
    <div id="page1" class="page">
      <div class="icon">🌸</div>
      <h1>Do you love me?</h1>
      <div class="btn-container">
        <button class="btn btn-yes" onclick="showPage2()">Yes</button>
        <button class="btn btn-no" onclick="handleNo()">No</button>
      </div>
    </div>

    <!-- Second Page (Yes) -->
    <div id="page2" class="page hidden">
      <video src="Yes.webm" autoplay muted loop></video>
      <h1 class="love-text">♡ Love you too ♡</h1>
      <div class="btn-container">
        <button class="btn btn-yes" onclick="showPage4()">I want to fuck you</button>
        <button class="btn btn-no" onclick="showPage5()">Just purely love you</button>
      </div>
    </div>

    <!-- Third Page (No) -->
    <div id="page3" class="page hidden">
      <video src="No.webm" autoplay muted loop></video>
      <button class="btn btn-no" onclick="goBack()">OK...</button>
    </div>

    <!-- Fourth Page (I want to fuck you) -->
    <div id="page4" class="page hidden">
      <video src="I want to fuck you too.webm" autoplay muted loop></video>
      <h1 class="love-text">I want to fuck you too 💦🍑🍆🍒💦</h1>
    </div>

    <!-- Fifth Page (Just purely love you) -->
    <div id="page5" class="page hidden">
      <video src="Ho ba.webm" autoplay muted loop></video>
      <h1 class="love-text">Ho ba...</h1>
    </div>

    <!-- Modal Popup -->
    <div id="modal" class="modal-overlay hidden">
      <div class="modal-box">
        <p id="modalMessage"></p>
        <button class="btn-ok" onclick="dismissModal()">OK...</button>
      </div>
    </div>
  </div>

  <script>
    let noClickCount = 0;

    function showPage2() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');
      document.body.classList.add('yes-background');
    }

    function handleNo() {
      noClickCount++;
      if (noClickCount >= 2) {
        showPage3();
      } else {
        showModal();
      }
    }

    function showModal() {
      const messages = [
        "Aww",
        "Don't lie",
        "I know you are lying",
        "I know deep down you love me~",
        "Love you",
        "😍",
        "No~~"
      ];
      const randomIndex = Math.floor(Math.random() * messages.length);
      document.getElementById('modalMessage').textContent = messages[randomIndex];
      document.getElementById('modal').classList.remove('hidden');
    }

    function dismissModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function showPage3() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page3').classList.remove('hidden');
    }

    function showPage4() {
      document.getElementById('page2').classList.add('hidden');
      document.getElementById('page4').classList.remove('hidden');
    }

    function showPage5() {
      document.getElementById('page2').classList.add('hidden');
      document.getElementById('page5').classList.remove('hidden');
    }

    function goBack() {
      document.getElementById('page3').classList.add('hidden');
      document.getElementById('page1').classList.remove('hidden');
    }
  </script>

</body>
</html>
