<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? ♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
      /* Changed to deeper pink, purple, and violet */
      background: linear-gradient(135deg, #ff1493 0%, #800080 50%, #4b0082 100%);
      background-size: 200% 200%;
      animation: gradientBG 6s ease infinite alternate;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3rem 2rem;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(219, 112, 147, 0.25);
      text-align: center;
      max-width: 380px;
      width: 88%;
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    .icon {
      font-size: 3rem;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #8a2be2;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .btn-container {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      color: white;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
    }

    .btn-yes:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(255, 105, 180, 0.6);
    }

    .btn-no {
      background: linear-gradient(135deg, #b19ffb 0%, #8a2be2 100%);
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .btn-no:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(138, 43, 226, 0.5);
    }

    .love-text {
      color: #ff1493;
      font-size: 2rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Home Page -->
    <div id="page1" class="page">
      <div class="icon">🌸</div>
      <h1>Do you love me?</h1>
      <div class="btn-container">
        <button class="btn btn-yes" onclick="showPage2()">Yes</button>
        <!-- Changed onclick to trigger the random popup function -->
        <button class="btn btn-no" onclick="showRandomMessage()">No</button>
      </div>
    </div>

    <!-- Second Page -->
    <div id="page2" class="page hidden">
      <div class="icon">💖</div>
      <h1 class="love-text">♡ Love you too ♡</h1>
    </div>
  </div>

  <script>
    function showPage2() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');
    }

    // New function for the 'No' button behavior
    function showRandomMessage() {
      const messages = [
        "Aww", 
        "Don't lie", 
        "I know you are lying", 
        "I know deep down you love me~", 
        "Love you", 
        "😍", 
        "No~~"
      ];
      const randomIndex = Math.floor(Math.random() * messages.length);
      alert(messages[randomIndex]);
    }
  </script>

</body>
</html>
